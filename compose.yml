name: semaco-new

services:
    php:
        build:
            context: etc/docker/php
            args:
                USER_ID: ${DOCKER_UID:-1000}
                GROUP_ID: ${DOCKER_GID:-1000}
        image: semaco/php:8.5-trixie
        user: ${DOCKER_USER:-1000:1000}
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            APP_ENV: ${APP_ENV:-dev}
            DATABASE_URL: "mysql://root:semaco@mysql/semaco_%kernel.environment%?serverVersion=8.4&charset=utf8mb4"
            MAILER_DSN: smtp://mailpit:1025
            PHP_IDE_CONFIG: serverName=semaco-new
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
            XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - .:/srv/sylius:rw,cached
            - ./etc/docker/php/conf.d/app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: semaco
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psemaco"]
            interval: 2s
            timeout: 3s
            retries: 30
        volumes:
            - mysql-data:/var/lib/mysql:rw
        ports:
            - "127.0.0.1:3309:3306"

    nginx:
        image: nginx:1.27-alpine
        depends_on:
            - php
        volumes:
            - ./etc/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/srv/sylius/public:ro
        ports:
            - "127.0.0.1:8095:80"

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "127.0.0.1:8029:8025"

    adminer:
        image: adminer:latest
        environment:
            ADMINER_DEFAULT_SERVER: mysql
        ports:
            - "127.0.0.1:8089:8080"
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql-data:

networks:
    default:
        ipam:
            config:
                - subnet: 172.16.95.0/24
