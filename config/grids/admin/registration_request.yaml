sylius_grid:
    grids:
        app_admin_registration_request:
            driver:
                name: doctrine/orm
                options:
                    class: App\Inquiry\Entity\RegistrationRequest
            sorting:
                createdAt: desc
            limits: [25, 50, 100]
            fields:
                createdAt:
                    type: datetime
                    label: Odesláno
                    sortable: createdAt
                    options:
                        format: 'd. m. Y H:i'
                companyName:
                    type: string
                    label: Firma
                    sortable: companyName
                identificationNumber:
                    type: string
                    label: IČ
                    sortable: identificationNumber
                fullName:
                    type: string
                    label: Kontaktní osoba
                email:
                    type: string
                    label: E-mail
                    sortable: email
                phone:
                    type: string
                    label: Telefon
                city:
                    type: string
                    label: Město
                    sortable: city
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [companyName, identificationNumber, email, firstName, lastName, city, message]
                createdAt:
                    type: date
                    label: Odesláno
            actions:
                item:
                    show:
                        type: show
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
