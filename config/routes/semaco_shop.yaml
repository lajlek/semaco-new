semaco_shop_product_list:
    path: /{_locale}/products-list/{slug}
    methods: [GET]
    defaults:
        _controller: sylius.controller.product::indexAction
        _sylius:
            template: "@SyliusShop/product/index.html.twig"
            grid: sylius_shop_product
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
        slug: .+(?<!/)

semaco_shop_taxon_redirect:
    path: /{_locale}/taxons/{slug}
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: semaco_shop_product_list
        permanent: true
        keepQueryParams: true
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
        slug: .+(?<!/)

semaco_shop_brand_redirect:
    path: /{_locale}/brand/{code}
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: sylius_shop_homepage
        permanent: true
        ignoreAttributes: [code]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$

semaco_shop_legacy_shipping_payment_redirect:
    path: /select-shipping-payment
    methods: [GET]
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: app_shop_checkout_select_shipping_payment
        permanent: false
        _locale: cs_CZ

semaco_shop_controllers:
    resource:
        path: ../../src/Shop/Controller/
        namespace: App\Shop\Controller
    type: attribute
