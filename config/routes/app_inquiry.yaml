app_inquiry_controllers:
    resource:
        path: ../../src/Inquiry/Controller/
        namespace: App\Inquiry\Controller
    type: attribute

app_admin_registration_request:
    resource: |
        alias: app.registration_request
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        only: ['index', 'show', 'delete', 'bulkDelete']
        grid: app_admin_registration_request
        permission: false
    type: sylius.resource
    prefix: /admin

app_admin_contact_message:
    resource: |
        alias: app.contact_message
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        only: ['index', 'show', 'delete', 'bulkDelete']
        grid: app_admin_contact_message
        permission: false
    type: sylius.resource
    prefix: /admin
