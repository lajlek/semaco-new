when@dev:
    sylius_fixtures:
        suites:
            semaco:
                listeners:
                    orm_purger: ~
                    logger: ~

                fixtures:
                    locale:
                        options:
                            locales: ['cs_CZ']
                            load_default_locale: false

                    currency:
                        options:
                            currencies: ['EUR', 'CZK']

                    geographical:
                        options:
                            countries: ['CZ', 'SK', 'DE', 'AT', 'PL']
                            zones:
                                CZ:
                                    name: 'Česká republika'
                                    countries: ['CZ']
                                EU:
                                    name: 'EU mimo ČR'
                                    countries: ['SK', 'DE', 'AT', 'PL']

                    channel:
                        options:
                            custom:
                                semaco:
                                    code: 'SEMACO'
                                    name: 'E-shop Semaco'
                                    hostname: 'localhost'
                                    enabled: true
                                    locales: ['cs_CZ']
                                    default_locale: 'cs_CZ'
                                    currencies: ['EUR', 'CZK']
                                    base_currency: 'EUR'
                                    default_tax_zone: 'CZ'
                                    tax_calculation_strategy: 'order_items_based'
                                    contact_email: 'info@semaco.cz'
                                    contact_phone_number: '+420 737 283 750'
                                    shop_billing_data:
                                        company: 'SEMACO tools and software, s.r.o.'
                                        tax_id: 'CZ64619338'
                                        street: 'B. Němcové 787'
                                        city: 'Jeseník'
                                        postcode: '790 01'
                                        country_code: 'CZ'

                    tax_category:
                        options:
                            custom:
                                standard:
                                    code: 'standard'
                                    name: 'Základní sazba'

                    tax_rate:
                        options:
                            custom:
                                vat_21:
                                    code: 'vat_21'
                                    name: 'DPH 21 %'
                                    zone: 'CZ'
                                    category: 'standard'
                                    amount: 0.21
                                    included_in_price: false

                    shipping_method:
                        options:
                            custom:
                                gls:
                                    code: '3'
                                    name: 'per GLS'
                                    zone: 'CZ'
                                    channels: ['SEMACO']
                                    enabled: true
                                    calculator:
                                        type: 'flat_rate'
                                        configuration:
                                            SEMACO:
                                                amount: 650
                                gls_cod:
                                    code: '10'
                                    name: 'per GLS záloha'
                                    zone: 'CZ'
                                    channels: ['SEMACO']
                                    enabled: false
                                    calculator:
                                        type: 'flat_rate'
                                        configuration:
                                            SEMACO:
                                                amount: 650
                                free_shipping:
                                    code: 'free_shipping'
                                    name: 'Doprava zdarma'
                                    zone: 'CZ'
                                    channels: ['SEMACO']
                                    enabled: true
                                    calculator:
                                        type: 'flat_rate'
                                        configuration:
                                            SEMACO:
                                                amount: 0

                    payment_method:
                        options:
                            custom:
                                bank_transfer:
                                    code: '10'
                                    name: 'Platebním příkazem'
                                    channels: ['SEMACO']
                                    enabled: true
                                prepayment:
                                    code: '12'
                                    name: 'Zálohově'
                                    channels: ['SEMACO']
                                    enabled: true

                    admin_user:
                        name: 'admin_user'
                        options:
                            custom:
                                -
                                    email: 'admin@semaco.test'
                                    username: 'admin'
                                    password: 'admin'
                                    enabled: true
                                    locale_code: 'cs_CZ'
                                    first_name: 'Admin'
                                    last_name: 'Semaco'

            semaco_test_customers:
                listeners:
                    logger: ~

                fixtures:
                    shop_user:
                        options:
                            custom:
                                -
                                    email: 'zakaznik@semaco.test'
                                    first_name: 'Testovací'
                                    last_name: 'Zákazník'
                                    password: 'semaco-dev'
                                    enabled: true

            semaco_test_sales_representative:
                listeners:
                    logger: ~

                fixtures:
                    shop_user:
                        options:
                            custom:
                                -
                                    email: 'obchodnik@semaco.test'
                                    first_name: 'Testovací'
                                    last_name: 'Obchodník'
                                    password: 'semaco-dev'
                                    enabled: true
